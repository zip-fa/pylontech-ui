name: Publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 26

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    name: '🐳 Build and publish'
    permissions:
      contents: read
      # Required for the workflow's GITHUB_TOKEN to push to the container registry.
      packages: write

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v5

      - name: '🟢 Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: '🗂 Cache Nx'
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-

      - name: '⬇️ Install dependencies'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: '🧹 Lint'
        run: npm run lint

      # Both projects: the web build emits apps/web/dist, and the daemon's target is a typecheck
      # (it ships as source and Node strips the types), so this is the only gate on daemon types.
      - name: '⚡️ Build'
        run: npm run build

      # The image ships this tree as-is, so everything the daemon does not require at runtime has
      # to go — which is nearly all of it, since the web app's dependencies are already inside
      # apps/web/dist. Scoping to the one workspace takes the tree from 70 MB to 8 MB. A second
      # `npm ci` rather than `npm prune` because only the former is lockfile-exact; it runs
      # offline from the npm cache restored above.
      - name: '✂️ Prune to runtime dependencies'
        run: npm ci --omit=dev --workspace daemon --no-audit --no-fund --prefer-offline

      - name: '🐳 Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: '🔐 Log in to the GHCR'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '🏷 Derive tags'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: '🐳 Build and push image'
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for a NUC or a VM, arm64 for a Raspberry Pi sitting next to the stack. No
          # emulation is needed: the image only copies files, and serialport's prebuilt bindings
          # cover both architectures from the one tree installed above.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
